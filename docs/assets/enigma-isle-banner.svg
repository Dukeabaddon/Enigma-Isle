<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Enigma Isle">
  <!-- Solid flat banner  no outlines, no photo-AI texture -->
  <rect width="1280" height="640" fill="#ECE0C8"/>
  <!-- sun -->
  <circle cx="1040" cy="120" r="64" fill="#D4A017"/>
  <!-- far hills -->
  <ellipse cx="320" cy="360" rx="280" ry="90" fill="#7A9E6E"/>
  <ellipse cx="720" cy="380" rx="340" ry="100" fill="#6B8F5F"/>
  <ellipse cx="1100" cy="370" rx="220" ry="80" fill="#7A9E6E"/>
  <!-- ocean -->
  <rect y="400" width="1280" height="120" fill="#3D8B8F"/>
  <rect y="500" width="1280" height="40" fill="#2F7377"/>
  <!-- sand -->
  <rect y="540" width="1280" height="100" fill="#C4A574"/>
  <!-- palm left -->
  <rect x="160" y="280" width="18" height="280" rx="4" fill="#5C4033"/>
  <ellipse cx="120" cy="270" rx="70" ry="28" fill="#2F6B3A" transform="rotate(-25 120 270)"/>
  <ellipse cx="200" cy="260" rx="70" ry="28" fill="#2F6B3A" transform="rotate(25 200 260)"/>
  <ellipse cx="168" cy="240" rx="60" ry="24" fill="#3A8A4A"/>
  <!-- palm right -->
  <rect x="1080" y="300" width="18" height="260" rx="4" fill="#5C4033"/>
  <ellipse cx="1040" cy="290" rx="70" ry="28" fill="#2F6B3A" transform="rotate(-30 1040 290)"/>
  <ellipse cx="1120" cy="280" rx="70" ry="28" fill="#2F6B3A" transform="rotate(30 1120 280)"/>
  <ellipse cx="1088" cy="260" rx="58" ry="24" fill="#3A8A4A"/>
  <!-- key mark -->
  <circle cx="640" cy="300" r="36" fill="#35231B"/>
  <rect x="628" y="300" width="24" height="56" rx="6" fill="#35231B"/>
  <rect x="620" y="340" width="40" height="12" rx="4" fill="#D4A017"/>
  <!-- wordmark -->
  <text x="640" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#1C1B18" letter-spacing="8">ENIGMA ISLE</text>
  <text x="640" y="520" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#35231B" letter-spacing="4">CLIENT-SIDE CIPHER LANDING</text>
</svg>
