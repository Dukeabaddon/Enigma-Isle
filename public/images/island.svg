<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Warm sky gradient: calmer top for white fade -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFF8EE"/>
      <stop offset="65%" stop-color="#FCEAD0"/>
      <stop offset="100%" stop-color="#F7D8B5"/>
    </linearGradient>

    <!-- Distant mountains / haze -->
    <linearGradient id="distMtnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C5DFD8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#93C5BA"/>
    </linearGradient>

    <!-- Midground lush hills -->
    <linearGradient id="midHillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E9F76"/>
      <stop offset="100%" stop-color="#2D7252"/>
    </linearGradient>

    <!-- Foreground island plateau -->
    <linearGradient id="foreHillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A825B"/>
      <stop offset="100%" stop-color="#1E523A"/>
    </linearGradient>

    <!-- Teal ocean -->
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4AA89F"/>
      <stop offset="100%" stop-color="#297A73"/>
    </linearGradient>

    <!-- Sandy beach rim -->
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1E2C3"/>
      <stop offset="100%" stop-color="#DEC399"/>
    </linearGradient>

    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFECB3" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FFE082" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Sun disk in upper third -->
  <circle cx="800" cy="380" r="180" fill="url(#sunGlow)"/>
  <circle cx="800" cy="380" r="60" fill="#FFF9C4" opacity="0.85"/>

  <!-- Soft distant clouds -->
  <path d="M 150,280 Q 220,240 300,280 Q 380,250 460,280 L 460,310 L 150,310 Z" fill="#FFFFFF" opacity="0.55"/>
  <path d="M 1100,240 Q 1180,210 1260,240 Q 1340,210 1420,250 L 1420,280 L 1100,280 Z" fill="#FFFFFF" opacity="0.6"/>

  <!-- Distant teal ocean horizon -->
  <path d="M 0,540 L 1600,540 L 1600,660 L 0,660 Z" fill="url(#seaGrad)"/>

  <!-- Distant islands / volcanic peaks -->
  <path d="M 60,540 Q 200,430 350,540 Z" fill="url(#distMtnGrad)"/>
  <path d="M 1250,540 Q 1380,450 1520,540 Z" fill="url(#distMtnGrad)"/>

  <!-- Sandy coastline spit -->
  <path d="M 0,620 Q 350,590 700,640 Q 1150,600 1600,630 L 1600,680 L 0,680 Z" fill="url(#sandGrad)"/>

  <!-- Midground Rolling Island Hills -->
  <path d="M 0,650 Q 250,520 550,630 Q 900,530 1250,620 Q 1450,570 1600,640 L 1600,900 L 0,900 Z" fill="url(#midHillGrad)"/>

  <!-- Foreground lush explorer ridge and cliffs -->
  <path d="M 0,720 Q 280,620 620,700 Q 980,630 1340,730 Q 1500,690 1600,740 L 1600,900 L 0,900 Z" fill="url(#foreHillGrad)"/>

  <!-- Stylized palm silhouettes on ridge -->
  <g fill="#1A4A33" opacity="0.9">
    <!-- Left tree cluster -->
    <path d="M 180,720 Q 195,650 200,600 Q 180,590 150,600 M 200,600 Q 220,570 250,580 M 200,600 Q 240,610 260,630 M 200,600 Q 190,560 170,570" stroke="#1A4A33" stroke-width="4" fill="none"/>
    <path d="M 230,730 Q 240,670 245,620 Q 225,610 200,620 M 245,620 Q 265,595 290,605 M 245,620 Q 280,630 300,645" stroke="#1A4A33" stroke-width="3" fill="none"/>

    <!-- Right tree cluster -->
    <path d="M 1380,730 Q 1370,660 1365,610 Q 1385,600 1410,610 M 1365,610 Q 1345,580 1320,590 M 1365,610 Q 1330,620 1310,640" stroke="#1A4A33" stroke-width="4" fill="none"/>
  </g>
</svg>
